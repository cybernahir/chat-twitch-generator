[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Node 20+: la API de presets y el gate comparten netlify/shared/session.ts,
  # que usa Web Crypto global (en Node 18 todavia no lo esta).
  NODE_VERSION = "20"

# El login vive en netlify/edge-functions/gate.ts y declara sus propias rutas
# ("/" y "/index.html"). /overlay.html queda fuera a proposito: OBS no puede
# atravesar un formulario de login.

# Alias comodo para la fuente de navegador.
[[redirects]]
  from = "/overlay"
  to = "/overlay.html"
  status = 200

[[headers]]
  for = "/overlay.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
